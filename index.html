<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourDate - Site de rencontre pour sourds</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header avec mode sombre/clair -->
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <i class="fas fa-deaf"></i>
                    <span>SourDate</span>
                </div>
                <div class="nav-menu">
                    <a href="#accueil" class="nav-link active">Accueil</a>
                    <a href="#profils" class="nav-link">Profils</a>
                    <a href="#chat" class="nav-link">Chat</a>
                    <button id="theme-toggle" class="theme-btn">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Section d'accueil -->
    <section id="accueil" class="hero">
        <div class="hero-content">
            <h1>Rencontres pour sourds et malentendants</h1>
            <p>Connectez-vous avec des personnes qui comprennent votre monde</p>
            <div class="hero-buttons">
                <button class="btn-primary" onclick="showLogin()">Se connecter</button>
                <button class="btn-secondary" onclick="showRegister()">S'inscrire</button>
            </div>
        </div>
        <div class="hero-visual">
            <i class="fas fa-hands-holding-child"></i>
        </div>
    </section>

    <!-- Modal Connexion/Inscription -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="loginForm">
                <h2><i class="fas fa-sign-in-alt"></i> Connexion</h2>
                <form onsubmit="login(event)">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="email" id="loginEmail" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Se connecter</button>
                </form>
                <p class="switch-form">Pas de compte ? <a href="#" onclick="switchToRegister()">S'inscrire</a></p>
            </div>
            <div id="registerForm" class="hidden">
                <h2><i class="fas fa-user-plus"></i> Inscription</h2>
                <form onsubmit="register(event)">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regPseudo" placeholder="Pseudo" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Mot de passe" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-deaf"></i>
                        <select id="regHandicap" required>
                            <option value="">Niveau d'audition</option>
                            <option value="sourd-profonde">Sourdité profonde</option>
                            <option value="sourd-partiel">Malentendant</option>
                            <option value="lsf">LSF (Langue des Signes Française)</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary full-width">S'inscrire</button>
                </form>
                <p class="switch-form">Déjà inscrit ? <a href="#" onclick="switchToLogin()">Se connecter</a></p>
            </div>
        </div>
    </div>

    <!-- Section Profils -->
    <section id="profils" class="profiles">
        <div class="container">
            <h2>Profils recommandés</h2>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher par pseudo ou ville...">
                <select id="filterHandicap">
                    <option value="">Tous les niveaux</option>
                    <option value="sourd-profonde">Sourdité profonde</option>
                    <option value="sourd-partiel">Malentendant</option>
                    <option value="lsf">LSF</option>
                </select>
            </div>
            <div id="profilesGrid" class="profiles-grid">
                <!-- Profils générés par JS -->
            </div>
        </div>
    </section>

    <!-- Section Chat -->
    <section id="chat" class="chat-section">
        <div class="container">
            <h2>Chat vidéo LSF</h2>
            <div class="chat-container">
                <div class="chat-list">
                    <h3>Conversations</h3>
                    <div id="chatList"></div>
                </div>
                <div class="chat-main">
                    <div class="video-container">
                        <video id="localVideo" autoplay muted></video>
                        <video id="remoteVideo" autoplay></video>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Tapez votre message...">
                        <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
